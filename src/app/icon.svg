<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#0035CC" />
    </linearGradient>

    <!-- Shield Left Facet Gradient -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E9FF" />
    </linearGradient>

    <!-- Shield Right Facet Gradient -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5D7FE" />
      <stop offset="100%" stop-color="#93B4FC" />
    </linearGradient>

    <!-- Core Emerald Beacon Glow -->
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001866" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS / Apple Style Squircle Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />

  <!-- Sentinel Shield Emblem -->
  <g filter="url(#shadow)">
    <!-- Left Facet -->
    <path
      d="M 64 24 L 32 37 C 32 68 45 93 64 104 L 64 24 Z"
      fill="url(#shieldLeft)"
    />
    <!-- Right Facet -->
    <path
      d="M 64 24 L 96 37 C 96 68 83 93 64 104 L 64 24 Z"
      fill="url(#shieldRight)"
    />
    
    <!-- Central Shield Seam & Inner Crest -->
    <path
      d="M 64 24 L 32 37 C 32 68 45 93 64 104 C 83 93 96 68 96 37 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </g>

  <!-- Central upay 'u' / Upward Trust Lightning Core -->
  <g transform="translate(64, 63)">
    <!-- Radar Ring -->
    <circle r="16" fill="none" stroke="#0047E0" stroke-width="2.5" stroke-opacity="0.3" />
    <circle r="11" fill="#004BE6" />
    
    <!-- AI Sentinel Pulse Beacon -->
    <circle r="6.5" fill="url(#beaconGrad)" />
    <circle r="2.5" fill="#FFFFFF" />
  </g>
</svg>
